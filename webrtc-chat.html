
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebRTC DataChannel Minimal FIX</title>
</head>
<body>

<h3>WebRTC DataChannel</h3>

<button onclick="createOffer()">Offer</button>
<button onclick="createAnswer()">Answer</button>

<p>Signal-Daten komplett kopieren!</p>

<textarea id="signal" rows="10" cols="80"></textarea><br>

<input id="msg" placeholder="Nachricht">
<button onclick="sendMsg()">Senden</button>

<pre id="log"></pre>

<script>
let pc = new RTCPeerConnection({
    iceServers: [{urls: "stun:stun.l.google.com:19302"}]
});

let channel;
let iceCandidates = [];

pc.onicecandidate = (event) => {
    if (event.candidate) {
        iceCandidates.push(event.candidate);
    } else {
        // ICE Gathering fertig -> alles in Textfeld schreiben
        document.getElementById("signal").value = JSON.stringify({
            sdp: pc.localDescription,
            candidates: iceCandidates
        });
        log("✅ ICE komplett gesammelt");
    }
};

pc.ondatachannel = (event) => {
    channel = event.channel;
    setupChannel();
};

function setupChannel() {
    channel.onopen = () => log("✅ Kanal offen");
    channel.onmessage = (e) => log("📩 " + e.data);
}

function log(msg) {
    document.getElementById("log").textContent += msg + "\n";
}

async function createOffer() {
    channel = pc.createDataChannel("chat");
    setupChannel();

    let offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    log("📤 Offer erstellt – warte auf ICE...");
}

async function createAnswer() {
    let data = JSON.parse(document.getElementById("signal").value);

    await pc.setRemoteDescription(data.sdp);

    // ICE vom Offer hinzufügen
    for (let c of data.candidates) {
        await pc.addIceCandidate(c);
    }

    let answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    log("📤 Answer erstellt – warte auf ICE...");
}

document.getElementById("signal").addEventListener("change", async () => {
    try {
        let data = JSON.parse(document.getElementById("signal").value);

        if (!pc.remoteDescription) {
            await pc.setRemoteDescription(data.sdp);

            for (let c of data.candidates) {
                await pc.addIceCandidate(c);
            }

            log("✅ Remote + ICE gesetzt");
        }
    } catch (e) {}
});

function sendMsg() {
    if (channel && channel.readyState === "open") {
        channel.send(document.getElementById("msg").value);
        log("📤 Gesendet");
    } else {
        log("⚠️ Kanal nicht offen");
    }
}
</script>

</body>
</html>
